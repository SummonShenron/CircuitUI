[project]
name = "circuitui-api"
version = "0.1.0"
description = "API for CircUIt, a low-code app builder that composes screens on top of Circuit workflows"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.6.0",
    "motor>=3.6.0",
    "httpx>=0.28.0",
    "PyJWT[crypto]>=2.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
